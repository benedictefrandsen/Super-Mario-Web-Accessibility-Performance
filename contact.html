<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <title>Marioclub</title>
</head>

<body>
    <header>
        <a href="index.html">
            <span class="brand">Marioclub</span>
        </a>
    </header>
    <section class="banner">
        <picture>
            <source srcset="img/banner.webp" type="image/webp">
            <img src="img/banner.jpg" alt="marioclub welcome banner">
        </picture>
        <div class="welcome">
            <h1>Get in Touch<br><span>with Marioclub</span></h1>
        </div>
    </section>
    <nav class="main-nav">
        <ul>
            <li><a href="index.html">Join the club</a></li>
            <li><a href="news.html">Latest news</a></li>
            <li><a href="games.html">New games</a></li>
            <li><a href="contact.html" class="join" aria-current="page">Contact</a></li>
        </ul>
    </nav>
    <main>
        <article>
            <h2>Get in touch with me, Mario</h2>
            <form>
                <label for="fname">First name</label>
                <input type="text" id="fname" name="fname" autocomplete="given-name" placeholder="Type Firstname" required>
                <label for="lname">Last name</label>
                <input type="text" id="lname" name="lname" autocomplete="family-name" placeholder="Type Lastname" required><br />
                <label for="mail">Email address</label>
                <input type="email" id="mail" name="mail" autocomplete="email" placeholder="Type Email" required>
                <label for="country">Country</label>
                <input list="countries" name="country" id="country" autocomplete="country-name">
                <datalist id="countries">
                    <option value="Albania">
                    <option value="Austria">
                    <option value="Belarus">
                    <option value="Belgium">
                    <option value="Bosnia">
                    <option value="Bulgaria">
                    <option value="Croatia">
                    <option value="Czech Republic">
                    <option value="Denmark">
                    <option value="Finland">
                    <option value="France">
                    <option value="Georgia">
                    <option value="Germany">
                    <option value="Greece">
                    <option value="Hungary">
                    <option value="Ireland">
                    <option value="Italy">
                    <option value="Kazakhstan">
                    <option value="Lithuania">
                    <option value="Netherlands">
                    <option value="Norway">
                    <option value="Poland">
                    <option value="Portugal">
                    <option value="Romania">
                    <option value="Russia">
                    <option value="Serbia">
                    <option value="Slovakia">
                    <option value="Spain">
                    <option value="Turkey">
                    <option value="Sweden">
                    <option value="Switzerland">
                    <option value="Ukraine">
                    <option value="United Kingdom">
                </datalist>
                <br />
                <label for="question">Your question</label>
                <textarea id="question" name="question" rows="4" cols="40" placeholder="Ask a question...">Ask a question</textarea>
                <input type="submit" value="Get in Touch">
            </form>
        </article>
        <ul class="images">
            <li><picture><source srcset="img/thumb-1.webp" type="image/webp"><img src="img/thumb-1.jpg" alt="Billede fra et Super Mario-spil: Mario rider på Yoshi og hopper mellem klipper i et skovlandskab, mens en ildkugle ruller nedenunder og mønter svæver i luften" loading="lazy"></picture></li>
            <li><picture><source srcset="img/thumb-2.webp" type="image/webp"><img src="img/thumb-2.jpg" alt="mario thumbnail 2" loading="lazy"></picture></li>
        </ul>
    </main>
    <section class="join">
        <h2>Contact Us today!</h2>
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Corporis dignissimos minus voluptatem.</p>
        <form>
            <label for="newsletter-email">Email address</label>
            <input type="email" id="newsletter-email" name="email" autocomplete="email" placeholder="Type email & hit enter" required>
            <button type="submit">Join the club</button>
        </form>

    </section>
    <footer>
        <p class="copyright">Copyright 2019 Marioclub</p>
    </footer>
</body>

</html>
